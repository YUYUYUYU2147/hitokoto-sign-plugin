<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1035"/>
      <stop offset="45%" stop-color="#3d1d6b"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7de2ff"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 星点 -->
  <g fill="#ffffff" opacity=".55">
    <circle cx="96" cy="96" r="2.4"/><circle cx="150" cy="72" r="1.5"/>
    <circle cx="392" cy="120" r="2"/><circle cx="430" cy="200" r="1.4"/>
    <circle cx="80" cy="330" r="1.6"/><circle cx="120" cy="420" r="2.2"/>
    <circle cx="400" cy="400" r="1.8"/><circle cx="340" cy="60" r="1.3"/>
    <circle cx="230" cy="48" r="1.7"/><circle cx="470" cy="300" r="1.2"/>
  </g>

  <!-- 外光晕 -->
  <circle cx="256" cy="262" r="132" fill="#a78bfa" opacity=".35" filter="url(#soft)"/>

  <!-- 对话框主体 -->
  <path d="M126 150h260a44 44 0 0 1 44 44v128a44 44 0 0 1-44 44H232l-72 62c-9 8-22 2-22-10v-52h-12a44 44 0 0 1-44-44V194a44 44 0 0 1 44-44z"
        fill="#140c26" opacity=".65"/>
  <path d="M126 142h260a44 44 0 0 1 44 44v128a44 44 0 0 1-44 44H232l-72 62c-9 8-22 2-22-10v-52h-12a44 44 0 0 1-44-44V186a44 44 0 0 1 44-44z"
        fill="none" stroke="url(#mark)" stroke-width="7" stroke-linejoin="round"/>

  <!-- 引号 -->
  <g fill="url(#mark)">
    <path d="M186 214c-22 0-38 17-38 38s16 36 36 36c4 0 8-1 11-2-4 18-16 30-34 36l6 14c34-10 54-38 54-76 0-27-15-46-35-46zm108 0c-22 0-38 17-38 38s16 36 36 36c4 0 8-1 11-2-4 18-16 30-34 36l6 14c34-10 54-38 54-76 0-27-15-46-35-46z"/>
  </g>

  <!-- 底部装饰线 -->
  <rect x="176" y="404" width="160" height="6" rx="3" fill="url(#glow)" opacity=".8"/>
  <circle cx="256" cy="407" r="9" fill="#7de2ff" opacity=".9" filter="url(#soft2)"/>
</svg>
